<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Clicker Game</title>

        <style>
            .PointsDisplay {
                text-align: center;
                font-size: 50px;
                color: #333;
                margin-top: 2%;
            }
            .PointsButton {
                display: block;
                margin: 20px auto;
                padding: 10px 20px;
                font-size: 20px;
                cursor: pointer;
            }
        </style>

        <script>
            // Variables
            let points = 3;

            // Helper Functions
            function CreateLoop(ms, ...args) {setInterval(() => {args.forEach((func) => {func();})}, ms)}
            function PointGain() {return 2}
            function SetUpUI(Class, Text) {document.querySelector(Class).textContent = Text;}

            // UI Functions

            function updatePoints() {SetUpUI(".PointsDisplay", "You Have " + points + " Points")};
            function UpdatePointButton() {SetUpUI(".PointsButton", "+" + PointGain() + " Points")}

            // Game Functions
            function addPoints() {points += PointGain();}

            // Initial UI Updates
            function UpdateUI() {CreateLoop(50, updatePoints, UpdatePointButton);}
            UpdateUI();
            document.addEventListener("DOMContentLoaded", updatePoints);
        </script>
    </head>

    <body>
        <h1 class="PointsDisplay">You Have 0 Points</h1>
        <button class="PointsButton" onclick="addPoints()">+1 Points</button>
    </body>
</html>
