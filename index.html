<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Clicker Game</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">

        <style>
            /* GENERAL */

            body {
                background: lightgray;
                min-height: 100dvh;
                margin: 0;
            }

            * {
                font-family: "Fredoka", sans-serif;
                text-align: center;
                color: #585656;
                text-shadow:
                    1.5px 0 black,
                    -1.5px 0 black,
                    0 1.5px black,
                    0 -1.5px black,
                    2px 2px 4px black;
            }

            /* BUTTONS */

            button {
                display: block;
                border-radius: 20px;
                cursor: pointer;
                margin: 20px auto;
                box-shadow: 2px 2px 4px black;
                border: black 3px solid;
                transition: transform 0.2s ease;
                width: 200px;
                height: 60px;
                font-size: 35px;
                white-space: nowrap;
                overflow: hidden;
            }

            .PointU1, .PointU2, .PointU3 {width: 400px;height: 40px}

            /* TEXT */

            .PointsDisplay {font-size: 50px; margin-top: 2%;}

            /* ANIMATIONS */

            Button {transition: transform 0.2s ease;}
            Button:hover {transform: scale(1.1);}
            Button:active {transform: scale(1.05);}
        </style>
    </head>

    <body>
        <h1 class="PointsDisplay">You Have 0 Points</h1>

        <button class="PointsButton" onclick="addPoints()">+2 Points</button>

        <h2><u>Upgrades</u></h2>

        <div>
            <button class="PointU1" onclick="BuyUpgrade('PointU1')">[1] +1 Points | 15 Points</button>
            <button class="PointU2" onclick="BuyUpgrade('PointU2')">[1] x1.15 Points | 500 Points</button>
            <button class="PointU3" onclick="BuyUpgrade('PointU3')">[1] x1.3 Points | 1M Points</button>
        </div>

        <script>
            /* ==================== */
            /* PLAYER DATA           */
            /* ==================== */

            let DefaultData = {
                points: 0,
                PointU1: 1,
                PointU2: 1,
                PointU3: 1
            };

            let Data = {...DefaultData};


            /* ==================== */
            /* UPGRADE DATA          */
            /* ==================== */

            const Upgrades = {
                PointU1: {
                    Type: "+",
                    Cost: 15,
                    CostMultiplier: 1.12,
                    Scale: 1.02,
                    Gain: 1
                },

                PointU2: {
                    Type: "x",
                    Cost: 500,
                    CostMultiplier: 1.33,
                    Scale: 1.03,
                    Gain: 1.15
                },

                PointU3: {
                    Type: "x",
                    Cost: 1e6,
                    CostMultiplier: 2.65,
                    Scale: 1.04,
                    Gain: 1.3
                }
            };


            /* ==================== */
            /* UI DATA               */
            /* ==================== */

            let UI = {};

            function CacheUI() {
                UI.PointsDisplay = document.querySelector(".PointsDisplay");
                UI.PointsButton = document.querySelector(".PointsButton");

                for (const Name in Upgrades) {
                    UI[Name] = document.querySelector("." + Name);
                }
            }


            /* ==================== */
            /* HELPER FUNCTIONS      */
            /* ==================== */

            function CreateLoop(ms, ...args) {
                setInterval(() => {
                    args.forEach((func) => {func();});
                }, ms);
            }

            function SetUpUI(Element, Text) {
                Element.textContent = Text;

                if (Element.tagName === "BUTTON") {
                    UpdateButtonTextSize(Element);
                }
            }

            function Short(Value) {
                if (Value === 0) return "0";

                const Suffixes = ["", "K", "M", "B", "T", "Qd", "Qn", "Sx", "Sp", "Oc", "No", "De", "Ude"];
                let Exponent = Math.floor(Math.log10(Math.abs(Value)) / 3);
                Exponent = Math.max(0, Math.min(Exponent, Suffixes.length - 1));

                return `${parseFloat((Value / (1000 ** Exponent)).toFixed(2))}${Suffixes[Exponent]}`;
            }

            function UpdateButtonTextSize(Button) {
                let FontSize = Math.min(Button.clientHeight * 0.6, 50);
                Button.style.fontSize = FontSize + "px";

                while ((Button.scrollWidth > Button.clientWidth || Button.scrollHeight > Button.clientHeight) && FontSize > 14) {
                    FontSize -= 1;
                    Button.style.fontSize = FontSize + "px";
                }
            }

            function UpdateAllButtonTextSizes() {
                document.querySelectorAll("button").forEach((Button) => {
                    UpdateButtonTextSize(Button);
                });
            }


            /* ==================== */
            /* SAVING                */
            /* ==================== */

            function SaveData() {
                localStorage.setItem("ClickerGameData", JSON.stringify(Data));
            }

            function LoadData() {
                let SavedData = localStorage.getItem("ClickerGameData");

                if (SavedData !== null) {
                    Data = {...DefaultData, ...JSON.parse(SavedData)};
                }
            }


            /* ==================== */
            /* GAME CALCULATIONS     */
            /* ==================== */

            function PointGain() {
                let Boost = 1;

                for (const Name in Upgrades) {
                    let Upgrade = Upgrades[Name];
                    let Level = Data[Name];

                    if (Upgrade.Type === "+") {
                        Boost += Level * Upgrade.Gain;
                    } else if (Upgrade.Type === "x") {
                        Boost *= Upgrade.Gain ** Level;
                    }
                }

                return Boost;
            }

            function UpgradeCost(Name) {
                let Upgrade = Upgrades[Name];
                let Level = Data[Name];

                return Upgrade.Cost * ((Upgrade.CostMultiplier ** Level) ** Upgrade.Scale);
            }

            function UpgradeGain(Name) {
                let Upgrade = Upgrades[Name];
                let Level = Data[Name];

                if (Level === 1) {
                    return Upgrade.Gain;
                }

                if (Upgrade.Type === "+") {
                    return Level * Upgrade.Gain;
                }

                return Upgrade.Gain ** Level;
            }


            /* ==================== */
            /* DISPLAY FUNCTIONS     */
            /* ==================== */

            const DisplayFunctions = {
                UpdatePoints: function() {
                    SetUpUI(UI.PointsDisplay, `You Have ${Short(Data.points)} Points`);
                },

                UpdatePointButton: function() {
                    SetUpUI(UI.PointsButton, `+${Short(PointGain())} Points`);
                },

                UpdateUpgrades: function() {
                    for (const Name in Upgrades) {
                        let Upgrade = Upgrades[Name];
                        let Level = Data[Name];
                        let Cost = UpgradeCost(Name);
                        let Gain = UpgradeGain(Name);

                        SetUpUI(UI[Name], `[${Short(Level)}] ${Upgrade.Type}${Short(Gain)} Points | ${Short(Cost)} Points`);
                    }
                }
            };


            /* ==================== */
            /* PLAYER ACTIONS        */
            /* ==================== */

            function addPoints() {
                Data.points += PointGain();
                SaveData();
            }


            /* ==================== */
            /* UPGRADES              */
            /* ==================== */

            function BuyUpgrade(Name) {
                let Cost = UpgradeCost(Name);

                if (Data.points >= Cost) {
                    Data.points -= Cost;
                    Data[Name] += 1;
                    SaveData();
                }
            }


            /* ==================== */
            /* INITIALIZATION        */
            /* ==================== */

            LoadData();
            CacheUI();

            window.addEventListener("resize", UpdateAllButtonTextSizes);

            CreateLoop(50, function() {
                for (const func in DisplayFunctions) {
                    DisplayFunctions[func]();
                }
            });
        </script>
    </body>
</html>
