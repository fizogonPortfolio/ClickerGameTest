<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Clicker Game</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">

        <style>
            * {
                font-family: "Fredoka", sans-serif;
                text-align: center;
                color: #585656;
                text-shadow:
                    1.5px 0 black,
                    -1.5px 0 black,
                    0 1.5px black,
                    0 -1.5px black,
                    2px 2px 4px black;
            }

            button {
                display: block;
                border-radius: 20px;
                cursor: pointer;
                margin: 20px auto;
                box-shadow: 2px 2px 4px black;
                border: black 3px solid;
                transition: transform 0.2s ease;
            }

            .PointsDisplay {
                font-size: 50px;
                margin-top: 2%;
            }

            .PointsButton {
                width: 200px;
                height: 60px;
                font-size: 35px;
            }

            /* Animations */
            Button {transition: transform 0.2s ease;}
            Button:hover {transform: scale(1.1);}
            Button:active {transform: scale(1.05);}

        </style>

        <script>
            let points = CreateData("points", 3);
            
            // HELPER FUNCTIONS
            function CreateData(Name, InitialValue) {if (localStorage.getItem(Name) === null) {localStorage.setItem(Name, InitialValue);} return Number(localStorage.getItem(Name));}
            function CreateLoop(ms, ...args) {setInterval(() => {args.forEach((func) => {func();});}, ms);}
            function SetUpUI(Class, Text) {document.querySelector(Class).textContent = Text;}

            // SAVING
            function SaveData() {localStorage.setItem("points", points);}

            // GAINS
            function PointGain() {return 2;}

            // DISPLAY FUNCTIONS

            const DisplayFunctions = {
                updatePoints: function() {SetUpUI(".PointsDisplay", "You Have " + points + " Points");},
                UpdatePointButton: function() {SetUpUI(".PointsButton", "+" + PointGain() + " Points");}
            };

            // ADD FUNCTIONS
            function addPoints() {points += PointGain(); SaveData();}

            // INITIAL

            CreateLoop(50, function() {for (const func in DisplayFunctions) {DisplayFunctions[func]();}});
        </script>
    </head>

    <body>
        <h1 class="PointsDisplay">You Have 0 Points</h1>
        <button class="PointsButton" onclick="addPoints()">+1 Points</button>
    </body>
</html>
